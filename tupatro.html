<meta charset="utf-8">
<title>Tupatro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=IBM+Plex+Mono:wght@400;600&family=Zilla+Slab:wght@400;500;600;700&display=swap">
<style>
:root{
  --ink:#0B1410;
  --felt:#1A4D3A;
  --felt-dark:#0F3527;
  --felt-edge:#082017;
  --chalk:#F3EDDF;
  --chalk-dim:#A8BCAF;
  --wood:#5C3A1E;
  --wood-hi:#8A5F33;
  --wood-lo:#33200F;
  --gold:#E5A93C;
  --gold-dim:#A77B2B;
  --chips:#57A6D9;
  --mult:#D2452F;
  --money:#E8C15A;
  --paper:#F5EFE2;
  --paper-sh:#CFC5AE;
  --red:#C0392B;
  --black:#20302A;
  --good:#6FBF7F;
  --font-d:"Alfa Slab One", Georgia, serif;
  --font-b:"Zilla Slab", Georgia, serif;
  --font-m:"IBM Plex Mono", ui-monospace, monospace;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ink); color:var(--chalk);
  font-family:var(--font-b); font-size:15px;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font-family:inherit; color:inherit}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px}

#app{
  display:grid; grid-template-columns:278px minmax(0,1fr);
  grid-template-rows:minmax(0,1fr) auto; height:100dvh; width:100%;
}

/* ---------- wood rail ---------- */
.rail{
  grid-row:1 / span 2; min-height:0; overflow-y:auto; overflow-x:hidden;
  padding:14px 14px 20px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.06), rgba(0,0,0,.35)),
    repeating-linear-gradient(96deg, var(--wood) 0 7px, var(--wood-lo) 7px 9px, var(--wood-hi) 9px 11px, var(--wood) 11px 19px);
  border-right:3px solid var(--wood-lo);
  box-shadow:inset -8px 0 20px rgba(0,0,0,.5);
  display:flex; flex-direction:column; gap:12px;
}
.brand{display:flex; align-items:baseline; justify-content:space-between; gap:6px}
.brand h1{
  font-family:var(--font-d); font-size:21px; font-weight:400; margin:0;
  color:var(--gold); text-shadow:0 2px 0 rgba(0,0,0,.6);
}
.brand span{font-family:var(--font-m); font-size:9px; letter-spacing:.14em; color:#D9C09A; text-transform:uppercase}

.seedchip{
  display:flex; align-items:center; justify-content:space-between; gap:6px; width:100%;
  font-family:var(--font-m); font-size:10px; letter-spacing:.1em; cursor:pointer;
  background:#16211C; border:1px solid #35493F; border-radius:5px; padding:5px 8px;
  color:#AFC4B6; text-align:left;
}
.seedchip:hover{background:#1F2E27; border-color:var(--gold-dim)}
.seedchip b{color:var(--gold); font-weight:600; letter-spacing:.14em}
.seedfield{
  width:100%; font-family:var(--font-m); font-size:15px; letter-spacing:.16em;
  padding:9px 11px; border-radius:6px; margin:4px 0 2px;
  background:#0D1714; color:var(--chalk); border:1px solid #35493F;
}
.seedfield:focus{outline:2px solid var(--gold); outline-offset:1px}

.plate{
  background:linear-gradient(180deg,#16211C,#0C1512);
  border:1px solid #2E4238; border-radius:7px; padding:10px 11px;
  box-shadow:0 3px 0 rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);
}
.lbl{font-family:var(--font-m); font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--chalk-dim)}

.blindplate{display:flex; gap:10px; align-items:center}
.blindmark{
  width:44px; height:44px; flex:none; border-radius:50%;
  display:grid; place-items:center; font-size:21px;
  border:2px solid rgba(0,0,0,.4);
  box-shadow:inset 0 2px 6px rgba(255,255,255,.25), 0 2px 5px rgba(0,0,0,.5);
}
.bm-0{background:radial-gradient(circle at 35% 30%,#7FA8C9,#38617E)}
.bm-1{background:radial-gradient(circle at 35% 30%,#D8A94E,#8A6320)}
.bm-2{background:radial-gradient(circle at 35% 30%,#C4564A,#6E241C)}
.blindname{font-family:var(--font-d); font-size:16px; line-height:1.15; margin-top:2px}
.bossnote{font-size:12.5px; color:#F0B9AE; line-height:1.3; margin-top:6px}

.slate{
  background:radial-gradient(120% 100% at 30% 0%, #263831, #16211D 70%);
  border:2px solid #0A120F; border-radius:6px; padding:9px 11px 11px;
  box-shadow:inset 0 0 24px rgba(0,0,0,.6), 0 3px 0 rgba(0,0,0,.4);
}
.scorebig{
  font-family:var(--font-m); font-weight:600; font-variant-numeric:tabular-nums;
  font-size:27px; line-height:1.05; letter-spacing:-.02em;
  text-shadow:0 0 10px rgba(243,237,223,.28);
}
.scoresub{font-family:var(--font-m); font-size:11px; color:var(--chalk-dim); font-variant-numeric:tabular-nums}
.bar{height:7px; border-radius:4px; background:#0B1512; overflow:hidden; margin-top:8px; border:1px solid #0A120F}
.bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--chips),var(--gold)); transition:width .45s cubic-bezier(.2,.7,.3,1)}
.bar.done i{background:linear-gradient(90deg,#5DBE7A,#9BE08A)}

.formula{display:flex; align-items:center; gap:5px; margin-top:9px; flex-wrap:wrap}
.pill{
  font-family:var(--font-m); font-weight:600; font-size:12.5px; padding:3px 8px; border-radius:4px;
  font-variant-numeric:tabular-nums; border:1px solid rgba(0,0,0,.45);
}
.pill.c{background:#1B4A68; color:#BFE3FA}
.pill.m{background:#5C1A12; color:#FFC4B4}
.pill.t{background:#4A3708; color:#FFDD98}
.pill.dead{background:#3A1512; color:#FF9C8A}
.times{font-family:var(--font-m); font-size:11px; color:var(--chalk-dim)}
.needline{font-size:11.5px; margin-top:7px; line-height:1.3}
.needline.warn{color:#FFB0A2}
.needline.ok{color:#9FE0AC}

.tallies{display:flex; gap:9px}
.tally{flex:1; text-align:center}
.tallymark{height:26px; margin-top:5px; display:flex; align-items:flex-end; justify-content:center; gap:3px; font-family:var(--font-d); font-size:20px; line-height:1}
.tallymark b{font-weight:400; color:var(--chalk); opacity:.92; transform:skewX(-9deg)}
.tallymark b.five{position:relative}
.tallymark b.five::after{
  content:""; position:absolute; left:-12px; right:-3px; top:48%; height:2px;
  background:var(--chalk); transform:rotate(-19deg); border-radius:2px;
}
.tally.them .tallymark b{color:#E2A69A}
.tallynum{font-family:var(--font-m); font-size:10px; color:var(--chalk-dim); margin-top:2px}

.stats{display:flex; gap:8px}
.stat{flex:1; text-align:center; background:#101A16; border:1px solid #2A3C33; border-radius:6px; padding:6px 4px}
.stat .v{font-family:var(--font-m); font-weight:600; font-size:16px; font-variant-numeric:tabular-nums}
.stat.money .v{color:var(--money)}

.jokers{display:flex; flex-direction:column; gap:6px}
.jk{
  display:flex; gap:8px; align-items:flex-start; padding:7px 8px; border-radius:6px;
  background:linear-gradient(180deg,#20302A,#16241F); border:1px solid #35493F;
  box-shadow:0 2px 0 rgba(0,0,0,.4); position:relative;
}
.jk .glyph{
  width:26px; height:34px; flex:none; border-radius:3px; display:grid; place-items:center;
  font-size:15px; background:var(--paper); color:var(--black);
  box-shadow:0 1px 3px rgba(0,0,0,.5); border:1px solid var(--paper-sh);
}
.jk.r-harvinainen .glyph{background:#CFE4F5}
.jk.r-eepos .glyph{background:#F2D08A}
.jk .nm{font-weight:700; font-size:13px; line-height:1.2}
.jk .tx{font-size:11.5px; line-height:1.3; color:#B9CCC1; margin-top:2px}
.jk .tag{font-family:var(--font-m); font-size:8.5px; letter-spacing:.1em; padding:0 4px; border-radius:3px; margin-left:4px; vertical-align:1px}
.jk .tag.rami{background:#5A1E17; color:#FFC1B4}
.jk .tag.nolo{background:#1D2C3C; color:#B9D5EE}
.jk .sell{
  position:absolute; top:5px; right:5px; font-family:var(--font-m); font-size:9px;
  background:#3C2A12; color:var(--money); border:1px solid #614318; border-radius:3px;
  padding:1px 4px; cursor:pointer;
}
.jk .sell:hover{background:#57391A}
.empty{font-size:12px; color:#8FA398; font-style:italic; padding:4px 2px}

.cons{display:flex; gap:6px; flex-wrap:wrap}
.consbtn{
  flex:1 1 108px; padding:7px 6px; border-radius:6px; cursor:pointer; text-align:left;
  background:linear-gradient(180deg,#2A3B52,#1B2839); border:1px solid #3E5573;
  box-shadow:0 2px 0 rgba(0,0,0,.4);
}
.consbtn:hover{filter:brightness(1.18)}
.consbtn .nm{font-weight:700; font-size:12px}
.consbtn .tx{font-size:10.5px; color:#AFC3D6; line-height:1.25; margin-top:2px}

.railbtns{display:flex; gap:6px; margin-top:auto; padding-top:6px}
.tinybtn{
  flex:1; padding:6px; border-radius:5px; cursor:pointer; font-size:12px; font-weight:600;
  background:#1A2620; border:1px solid #35493F; color:#C6D8CD;
}
.tinybtn:hover{background:#243329}

/* ---------- felt ---------- */
.tablewrap{position:relative; min-height:0; padding:14px 16px 6px}
.felt{
  position:relative; height:100%; border-radius:16px; overflow:hidden;
  background:
    radial-gradient(110% 90% at 50% 38%, #22624A 0%, var(--felt) 42%, var(--felt-dark) 78%, var(--felt-edge) 100%),
    repeating-linear-gradient(45deg, rgba(0,0,0,.05) 0 2px, transparent 2px 4px);
  border:5px solid var(--wood-lo);
  box-shadow:inset 0 0 60px rgba(0,0,0,.55), 0 8px 24px rgba(0,0,0,.5);
}
.felt::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px);
}

.seat{position:absolute; display:flex; align-items:center; gap:7px; z-index:3}
.seat .av{
  width:34px; height:34px; border-radius:50%; display:grid; place-items:center; flex:none;
  font-family:var(--font-d); font-size:15px; color:#12201A;
  background:linear-gradient(180deg,#C9B48C,#94815C); border:2px solid #0D1A14;
  box-shadow:0 2px 6px rgba(0,0,0,.5);
}
.seat.us .av{background:linear-gradient(180deg,#E9C468,#B98B29)}
.seat.mate .av{background:linear-gradient(180deg,#9FD3B4,#5D9B78)}
.seat .who{font-size:12.5px; font-weight:600; line-height:1.15; white-space:nowrap}
.seat .sub{font-family:var(--font-m); font-size:9.5px; color:#9DBBA9; max-width:196px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.seat.active .av{box-shadow:0 0 0 3px var(--gold), 0 2px 10px rgba(0,0,0,.5)}
.seat.active .who{color:var(--gold)}
.seat.out{opacity:.42}
.seat-n{top:12px; left:50%; transform:translateX(-50%)}
.seat-s{bottom:10px; left:50%; transform:translateX(-50%)}
.seat-w{left:12px; top:50%; transform:translateY(-50%); flex-direction:column; text-align:center; gap:3px}
.seat-e{right:12px; top:50%; transform:translateY(-50%); flex-direction:column; text-align:center; gap:3px}
.dealerchip{
  font-family:var(--font-m); font-size:8.5px; font-weight:600; letter-spacing:.08em;
  background:#F3EDDF; color:#12201A; border-radius:9px; padding:1px 5px;
}
.showchip{
  font-family:var(--font-m); font-size:8.5px; font-weight:600; letter-spacing:.08em;
  border-radius:9px; padding:1px 5px;
}
.showchip.rami{background:#8E2A1C; color:#FFD9CF}
.showchip.nolo{background:#1F2E3F; color:#CBDDEE}

.modebox{
  position:absolute; top:12px; right:14px; z-index:4;
  background:rgba(8,24,18,.74); border:1px solid #2F5F4B; border-radius:9px; padding:7px 11px;
  text-align:right; max-width:230px;
}
.modebox .val{font-family:var(--font-d); font-size:19px; line-height:1.05}
.modebox .val.rami{color:#FF9E85}
.modebox .val.nolo{color:#9EC8EE}
.modebox .note{font-size:11.5px; color:#BCD2C5; line-height:1.3; margin-top:3px}

.slot{position:absolute; z-index:2}
.slot-n{left:50%; top:calc(50% - 96px); transform:translate(-50%,-50%)}
.slot-s{left:50%; top:calc(50% + 96px); transform:translate(-50%,-50%)}
.slot-w{left:calc(50% - 108px); top:50%; transform:translate(-50%,-50%)}
.slot-e{left:calc(50% + 108px); top:50%; transform:translate(-50%,-50%)}
.slot .card{box-shadow:0 8px 18px rgba(0,0,0,.55)}
.slot.win .card{box-shadow:0 0 0 3px var(--gold), 0 10px 22px rgba(0,0,0,.6)}
@keyframes drop{from{opacity:0; transform:translateY(-26px) scale(.86)} to{opacity:1; transform:none}}
.slot .card.fresh{animation:drop .26s cubic-bezier(.2,.9,.3,1.2)}

.center-msg{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:1;
  font-family:var(--font-d); font-size:15px; color:rgba(243,237,223,.28); text-align:center;
  pointer-events:none; width:190px; line-height:1.3;
}

.pop{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:8;
  display:flex; align-items:center; gap:7px; pointer-events:none;
  background:rgba(6,18,13,.88); border:1px solid #3B6C57; border-radius:10px; padding:9px 13px;
  box-shadow:0 10px 30px rgba(0,0,0,.6);
}
@keyframes popin{0%{opacity:0; transform:translate(-50%,-30%) scale(.8)}12%{opacity:1; transform:translate(-50%,-50%) scale(1.06)}22%{transform:translate(-50%,-50%) scale(1)}82%{opacity:1}100%{opacity:0; transform:translate(-50%,-78%) scale(.96)}}
.pop.go{animation:popin 1.5s ease forwards}
.pop .ht{font-family:var(--font-d); font-size:14px; color:var(--gold); margin-right:3px}
.pop .eq{font-family:var(--font-m); font-size:19px; font-weight:600; color:#FFF3D6}

 /* --- näyttöpaneeli filtin päällä (ei peitä kättä) --- */
#declpanel:empty{display:none}
#declpanel{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:12;
  width:min(460px, calc(100% - 32px)); max-height:calc(100% - 20px); overflow-y:auto;
  background:linear-gradient(180deg,#16241E,#0D1714);
  border:2px solid var(--gold-dim); border-radius:12px; padding:14px 16px;
  box-shadow:0 18px 50px rgba(0,0,0,.7);
}
#declpanel h3{font-family:var(--font-d); font-weight:400; font-size:18px; margin:0 0 5px; color:var(--gold)}
#declpanel p{font-size:12px; line-height:1.4; color:#B4C8BC; margin:0 0 8px}
#declpanel .fine{font-size:10.5px; color:#7F9488; margin:4px 0 0}
/* napit pysyvät näkyvissä vaikka paneeli vierisi */
#declpanel .row{
  position:sticky; bottom:0; z-index:2;
  margin:10px -16px -14px; padding:10px 16px 14px;
  background:#0D1714;
  box-shadow:0 -12px 16px 2px #0D1714;
}
#declpanel .btn{font-size:14px; padding:9px 15px}
#declpanel .ln{display:flex; justify-content:space-between; gap:10px; font-size:12px; padding:3px 0; border-bottom:1px dashed #2A3B33}
#declpanel .ln b{font-family:var(--font-m); color:var(--money); text-align:right}
#declpanel .warn{color:#FF9E85}

/* --- jalostetut kortit --- */
.card.e-bonus{background:linear-gradient(168deg,#EAF2FB,#CFE0F2 60%,#B7CFE8)}
.card.e-mult{background:linear-gradient(168deg,#FBE7E2,#F2CFC6 60%,#E5B5A9)}
.card.e-wild{background:linear-gradient(168deg,#F1E9FB,#DDCCF2 60%,#C9B4E6)}
.card.e-steel{background:linear-gradient(168deg,#EDEFF1,#CBD2D8 60%,#AEB8C0)}
.card.e-glass{background:linear-gradient(168deg,#EAF9F8,#C8ECEA 60%,#A8DBD8)}
.card.e-gold{background:linear-gradient(168deg,#FCF1D2,#F0DA9C 60%,#DFC470)}
.card.e-stone{
  background:linear-gradient(168deg,#9AA0A0,#7C8484 55%,#606868);
  color:#20302A; border-color:#5A6262;
}
.card.e-stone .big{opacity:.55; font-size:30px}
.card .ebadge{
  position:absolute; top:3px; right:4px; font-size:10px; line-height:1;
  background:rgba(32,48,42,.82); color:#F3EDDF; border-radius:3px; padding:2px 3px;
}
.card.mini .ebadge{font-size:8px; padding:1px 2px}

/* --- tuppipakka --- */
.sidedeck{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin:8px 0}
.sidecard{cursor:pointer; transition:transform .14s ease, box-shadow .14s ease}
.sidecard:hover{transform:translateY(-5px)}
.sidecard.picked{box-shadow:0 0 0 3px var(--gold), 0 8px 16px rgba(0,0,0,.5); transform:translateY(-6px)}
.sidecard.used{opacity:.32; cursor:not-allowed}
.sidelist{display:flex; gap:5px; flex-wrap:wrap}
.sideitem{position:relative}
.sideitem .sell{
  position:absolute; top:-4px; right:-4px; font-family:var(--font-m); font-size:8.5px;
  background:#3C2A12; color:var(--money); border:1px solid #614318; border-radius:3px;
  padding:0 3px; cursor:pointer; line-height:1.4;
}
.sideitem .sell:hover{background:#57391A}

/* --- käden järjestely --- */
.handtools{display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:center; min-height:22px}
.handtools:empty{display:none}
.sortbtn{
  font-family:var(--font-m); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  padding:4px 9px; border-radius:5px; cursor:pointer;
  background:#16211C; border:1px solid #35493F; color:#AFC4B6;
}
.sortbtn:hover{background:#1F2E27}
.sortbtn.on{background:#2E4436; border-color:var(--gold-dim); color:var(--gold)}
.handtools .tip{font-family:var(--font-m); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:#6F8579}
.handrow.spread .hcard{margin-left:4px}
.handrow.spread .hcard:first-child{margin-left:0}
.hcard{touch-action:none}
.hcard.dragging{
  transform:translateY(-18px) scale(1.06) rotate(1.5deg); z-index:20;
  box-shadow:0 16px 30px rgba(0,0,0,.62); cursor:grabbing; transition:none;
}
.handzone{padding:2px 16px 14px; display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0; width:100%}
.handrow{
  display:flex; justify-content:center; align-items:flex-end; min-height:112px; padding-top:12px;
  max-width:100%; overflow-x:auto; overflow-y:hidden; scrollbar-width:thin; padding-bottom:4px;
}
.handrow::-webkit-scrollbar{height:6px}
.handrow::-webkit-scrollbar-thumb{background:#2C4136; border-radius:3px}
.hint{font-family:var(--font-m); font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:#7E9488; text-align:center}

/* ---------- cards ---------- */
.card{
  width:66px; height:94px; border-radius:6px; position:relative; flex:none;
  background:linear-gradient(168deg,#FBF7EC,var(--paper) 55%,#E8DFCB);
  border:1px solid #B9AE94; box-shadow:0 3px 7px rgba(0,0,0,.45);
  color:var(--black); user-select:none;
}
.card .r{position:absolute; top:4px; left:6px; font-family:var(--font-d); font-size:17px; line-height:1}
.card .sm{position:absolute; top:22px; left:7px; font-size:12px; line-height:1}
.card .big{position:absolute; left:50%; top:54%; transform:translate(-50%,-50%); font-size:33px; line-height:1; opacity:.92}
.card.red{color:var(--red)}
.card .chip{position:absolute; bottom:3px; right:5px; font-family:var(--font-m); font-size:9px; color:#8A8067}
.card.mini{width:42px; height:58px}
.card.mini .r{font-size:11px; top:3px; left:4px}
.card.mini .sm{display:none}
.card.mini .big{font-size:20px}
.card.mini .chip{display:none}
.card.shown{box-shadow:0 0 0 2px var(--gold), 0 3px 7px rgba(0,0,0,.45)}

.hcard{cursor:pointer; margin-left:-13px; transition:transform .16s ease, filter .16s ease, box-shadow .16s ease; transform-origin:50% 130%}
.hcard:first-child{margin-left:0}
.hcard.playable:hover,.hcard.playable:focus-visible{transform:translateY(-16px) scale(1.05); z-index:5; box-shadow:0 12px 22px rgba(0,0,0,.55)}
.hcard.dead{filter:grayscale(.75) brightness(.6); cursor:not-allowed}
.hcard.pick{cursor:pointer}
.hcard.pick:hover{transform:translateY(-16px) scale(1.05)}

/* ---------- overlay ---------- */
.overlay{
  position:fixed; inset:0; z-index:40; display:grid; place-items:center; padding:18px;
  background:radial-gradient(80% 70% at 50% 40%, rgba(9,26,19,.86), rgba(4,10,8,.96));
  overflow-y:auto;
}
.panel{
  width:min(880px,100%); background:linear-gradient(180deg,#13211B,#0C1613);
  border:2px solid #2E4B3D; border-radius:14px; padding:22px 24px 24px;
  box-shadow:0 24px 60px rgba(0,0,0,.7);
}

  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}

function setSeed(g, str) {

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const t = a[i];
    a[i] = a[j];
    a[j] = t;
  }
  return a;
}

function later(fn, ms) {

/* Oma käsi: pelaajan valitsema järjestys, tai itse raahattu. */
function applySort(g) {
  if (g.customOrder) return;

  if (g.sortMode === "rank") h.sort((a, b) => b.r - a.r || SUITS.indexOf(a.s) - SUITS.indexOf(b.s));

}

/* ============================ pelilogiikka ============================ */
function trickSize(g) {
  return g.sooli ? 3 : 4;
}

function nextSeat(g, p) {
  if (!g.sooli) return (p + 1) % 4;
  const i = g.sooliOrder.indexOf(p);

/* Ajettu maa = ensimmäisen maallisen kortin maa (kivikortti ei aja maata). */

/* Ajettu maa = ensimmäisen maallisen kortin maa (kivikortti ei aja maata). */
function leadSuit(g) {
  for (const t of g.trick) if (!isStone(t.card)) return t.card.s;
  return null;
}

/* maantuntopakko — kivikortin saa aina pelata, villi kortti käy tunnustukseksi */

/* maantuntopakko — kivikortin saa aina pelata, villi kortti käy tunnustukseksi */
function legalCards(g, p) {
  const h = g.hands[p],
    ls = leadSuit(g);
  if (ls === null) return h.slice();
  const follow = h.filter((c) => matchesSuit(c, ls));
  if (!follow.length) return h.slice();
  return follow.concat(h.filter(isStone));
}
/* ei valttia: tikin voittaa suurin kortti ajettua maata. Kivikortti ei voita koskaan,
   ja tasatilanteessa voittaa aiemmin pelattu kortti (vertailu on aidosti suurempi). */

/* ei valttia: tikin voittaa suurin kortti ajettua maata. Kivikortti ei voita koskaan,
   ja tasatilanteessa voittaa aiemmin pelattu kortti (vertailu on aidosti suurempi). */
function currentWinner(g) {
  if (!g.trick.length) return null;
  const ls = leadSuit(g);
  let best = null;
  for (const t of g.trick) {
    if (!matchesSuit(t.card, ls)) continue;
    if (!best || rv(g, t.card) > rv(g, best.card)) best = t;
  }
  return best || g.trick[0];
}

/* Ramissa pisteytät viemäsi tikit, nolossa (ja soolissa) väistämäsi. */
function scoresForUs(g, winnerSeat) {
  if (g.sooli) return winnerSeat !== 0;
  return g.mode === "rami" ? isUs(winnerSeat) : !isUs(winnerSeat);
}

/* Tuppi-kerroin. Ramissa 7. tikistä alkaen (4 pistettä/tikki -> ×1, ×2, ×3…),
   nolossa kuudesta alaspäin, ryöstössä kaksinkertaisena. */

/* ==== src/scoring.js ============================================== */
/* ============================ pisteytys ============================ */
function evalTrick(cards) {
  /* Kivikortilla ei ole arvoa eikä maata, joten se ei osallistu tikkityyppiin. */
  const live = cards.filter((c) => !isStone(c));
  if (live.length < 2) return TYPES.high;
  const ranks = live.map((c) => c.r).sort((a, b) => a - b);
  const flush = new Set(live.filter((c) => !isWild(c)).map((c) => c.s)).size <= 1;
  const counts = {};
  ranks.forEach((r) => (counts[r] = (counts[r] || 0) + 1));
  const cv = Object.values(counts).sort((a, b) => b - a);
  const uniq = Array.from(new Set(ranks));
  const straight =
    uniq.length === live.length && uniq[uniq.length - 1] - uniq[0] === live.length - 1;
  if (flush && straight) return TYPES.sf;
  if (cv[0] === 4) return TYPES.quad;
  if (cv[0] === 3) return TYPES.trips;
  if (flush) return TYPES.flush;
  if (straight) return TYPES.straight;
  if (cv[0] === 2 && cv[1] === 2) return TYPES.twopair;
  if (cv[0] === 2) return TYPES.pair;
  return TYPES.high;
}

/* Ramissa pisteytät viemäsi tikit, nolossa (ja soolissa) väistämäsi. */

/* Tuppi-kerroin. Ramissa 7. tikistä alkaen (4 pistettä/tikki -> ×1, ×2, ×3…),
   nolossa kuudesta alaspäin, ryöstössä kaksinkertaisena. */
function tuppiInfo(g) {
  const t = g.usTricks;
  const bonus = g.jokers.reduce((a, j) => a + (j.tuppi || 0), 0) + g.tuppiBonus;
  const kitsas = g.boss && g.boss.id === "kitsas" ? 1 : 0;
  const fin = (m) => Math.max(1, m + bonus - kitsas);

  if (g.sooli) {
    if (g.sooliBust) return { mult: 0, need: "Sooli kaatui — yksikin tikki riitti.", ok: false };
    return { mult: fin(6), need: "Sooli: älä vie yhtään tikkiä (" + t + " vietyä).", ok: t === 0 };
  }
  if (g.mode === "rami") {
    if (t < 7) return { mult: 0, need: "Ramiin tarvitaan 7 tikkiä — " + t + "/7.", ok: false };
    let m = t - 6;
    const rob = g.ramTeam === 1;
    if (rob) m *= 2;
    return {
      mult: fin(m),
      need: (rob ? "Ryöstö! " : "") + t + " tikkiä = " + (t - 6) + (rob ? " × 2 (ryöstö)" : ""),
      ok: true,
    };
  }
  if (t > 6) return { mult: 0, need: "Nolo kaatui — " + t + " tikkiä (yli kuuden).", ok: false };
  return { mult: fin(7 - t), need: "Nolo: " + t + " tikkiä, kerroin putoaa jokaisesta.", ok: true };
}

function tuppiMult(g) {
  return tuppiInfo(g).mult;
}

function finalScore(g) {
  return Math.round(g.base * tuppiMult(g));
}

function scoreTrick(g, winnerSeat, leadSeat, cards) {
  const type = evalTrick(cards);
  const ctx = {
    cards,
    winner: winnerSeat,
    lead: leadSeat,
    type,
    mode: g.mode,
    robbery: g.mode === "rami" && g.ramTeam === 1,
    usBefore: g.usTricks,
    themBefore: g.themTricks,
    scoredBefore: g.scored,
    chips: type.chips + cards.reduce((a, c) => a + chipValue(g, c), 0),
    mult: g.boss && g.boss.id === "kasijarru" ? 1 : type.mult,
    /* Jokerit lukevat pelitilaa vain ctx:n kautta, jotta content.js pysyy puhtaana datana. */
    money: g.money,
    sideDeckEnh: g.sideDeck.filter((c) => c.enh).length,
    payout: 0,
  };
  /* Järjestys: korttien lisäykset, jokerien lisäykset, korttien kertoimet, jokerien kertoimet. */
  ctx.mult += 5 * cards.filter((c) => c.enh === "mult").length;
  for (const j of g.jokers) if (j.add) j.add(ctx);
  for (const c of cards) if (c.enh === "glass") ctx.chips *= 2;
  /* teräskortti vaikuttaa niin kauan kuin se on yhä pelaamatta */
  const steel = (g.hands[0] || []).filter((c) => c.enh === "steel").length;
  for (let i = 0; i < steel; i++) ctx.mult *= 1.5;
  ctx.steel = steel;
  for (const j of g.jokers) if (j.xm) ctx.mult *= j.xm(ctx);
  let times = 1;
  for (const j of g.jokers) if (j.retrig) times += j.retrig(ctx);
  for (const j of g.jokers) if (j.won) j.won(ctx);
  ctx.payout += 3 * cards.filter((c) => c.enh === "gold").length;
  if (ctx.payout) g.money += ctx.payout;
  ctx.mult = Math.max(1, ctx.mult);
  ctx.times = times;
  ctx.total = Math.round(ctx.chips * ctx.mult) * times;
  return ctx;
}

/* ==== src/ai.js =================================================== */
function handPower(g, p) {
  const h = g.hands[p];
  let s = 0;
  for (const c of h) s += c.r === 14 ? 3 : c.r === 13 ? 2 : c.r === 12 ? 1 : 0;
  const bySuit = {};
  h.forEach((c) => (bySuit[c.s] = (bySuit[c.s] || 0) + 1));
  for (const k in bySuit) if (bySuit[k] <= 1) s += 1;
  return s;
}

function aiDeclare(g, p) {
  return handPower(g, p) >= 9 ? "rami" : "nolo";
}

function chooseAI(g, p) {
  const legal = legalCards(g, p);
  if (g.boss && g.boss.id === "umpimahka" && p === 2 && !g.sooli)
    return legal[Math.floor(rnd() * legal.length)];

  const low = (a) => a.slice().sort((x, y) => rv(g, x) - rv(g, y))[0];
  const high = (a) => a.slice().sort((x, y) => rv(g, y) - rv(g, x))[0];
  /* Ramissa vastustaja haluaa tikkejä, nolossa väistää niitä.
     Soolissa ramaajat pelaavat matalaa: tavoite on pakottaa soolaaja viemään tikki. */
  const wantsTricks = g.sooli ? false : g.mode === "rami";

  if (!g.trick.length) {
    /* Soolia vastaan matala aloitus on tappava; kerhopelaaja ei kuitenkaan osu siihen joka kerta. */
    if (g.sooli) return rnd() < 0.35 ? low(legal) : legal[Math.floor(rnd() * legal.length)];
    if (!wantsTricks) return low(legal);
    const aces = legal.filter((c) => rv(g, c) === 14);
    if (aces.length) return aces[0];
    const bySuit = {};
    legal.forEach((c) => {
      if (!isStone(c)) (bySuit[c.s] = bySuit[c.s] || []).push(c);
    });
    if (!Object.keys(bySuit).length) return legal[0];
    const suits = Object.keys(bySuit).sort((a, b) => bySuit[b].length - bySuit[a].length);
    return bySuit[suits[0]].slice().sort((a, b) => rv(g, b) - rv(g, a))[0];
  }

  const w = currentWinner(g);
  const ls = leadSuit(g);
  const partner = (p + 2) % 4;
  const last = g.trick.length === trickSize(g) - 1;
  const wStone = isStone(w.card);
  const canWin = legal.filter((c) => matchesSuit(c, ls) && (wStone || rv(g, c) > rv(g, w.card)));

  if (!wantsTricks) {
    /* nolo: kivikortti on varma väistö, muuten pysy alle */
    const stones = legal.filter(isStone);
    if (stones.length) return stones[0];
    const under = legal.filter((c) => matchesSuit(c, ls) && !wStone && rv(g, c) < rv(g, w.card));
    if (under.length) return under[under.length - 1];
    if (legal.every((c) => !matchesSuit(c, ls))) return high(legal); /* tyhjä maa: heitä roskat */
    return low(legal);
  }
  if (w.p === partner && !g.sooli && (last || rv(g, w.card) >= 13)) return low(legal);
  if (canWin.length) return low(canWin);
  return low(legal);
}

/* ============================ raha & kauppa ============================ */
function rollCardOffer() {
  const keys = ["stone", "wild", "steel", "glass", "bonus", "mult", "gold"];
  const enh = keys[Math.floor(rnd() * keys.length)];
  const e = ENH[enh];
  if (enh === "stone")
    return { id: "card-stone", n: e.n, g: e.g, p: e.p, t: e.t, card: { s: "S", r: 2, enh: enh } };
  const ranks = [14, 13, 12, 11, 10, 9, 5, 4, 3, 2];
  const r = ranks[Math.floor(rnd() * ranks.length)];
  const su = SUITS[Math.floor(rnd() * 4)];
  return {
    id: "card-" + enh + su + r,
    n: e.n + " " + rankLabel(r) + SM[su].g,
    g: e.g,
    p: e.p,
    t: e.t,
    card: { s: su, r: r, enh: enh },
  };
}

function rollShop(afterBoss) {
  const owned = new Set(G.jokers.map((j) => j.id));
  const ownedV = new Set(G.vouchers);
  const items = [];
  for (let i = 0; i < G.shopSlots; i++) {
    const roll = rnd();
    /* Balatro: kuponkeja tarjotaan pomon jälkeen. */
    let kind =
      roll < 0.46
        ? "joker"
        : roll < 0.74
          ? "card"
          : afterBoss && roll > 0.9
            ? "voucher"
            : "consumable";
    if (kind === "card") {
      items.push({ kind, data: rollCardOffer(), price: 0, sold: false });
      continue;
    }
    let src;
    if (kind === "joker") {
      src = JOKERS.filter((j) => !owned.has(j.id) && !items.some((x) => x.data.id === j.id));
      if (!src.length) kind = "consumable";
    }
    if (kind === "voucher") {
      src = VOUCHERS.filter((v) => !ownedV.has(v.id) && !items.some((x) => x.data.id === v.id));
      if (!src.length) kind = "consumable";
    }
    if (kind === "consumable") src = CONSUMABLES;
    items.push({ kind, data: src[Math.floor(rnd() * src.length)], price: 0, sold: false });
  }
  items.forEach((it) => (it.price = it.data.p));
  G.shop = items;
  G.shopAfterBoss = !!afterBoss;
  G.rerollCost = 5;
}

function buy(idx) {
  const it = G.shop[idx];
  if (!it || it.sold || G.money < it.price) return;
  if (it.kind === "joker" && G.jokers.length >= G.jokerSlots) {
    toast("Jokeripaikat täynnä — myy jokin ensin.");
    return;
  }
  if (it.kind === "card" && G.sideDeck.length >= G.sideSlots) {
    toast("Tuppipakka on täynnä — myy kortti ensin.");
    return;
  }
  if (it.kind === "consumable" && G.consumables.length >= G.consSlots) {
    toast("Temppupaikat täynnä.");
    return;
  }
  G.money -= it.price;
  it.sold = true;
  if (it.kind === "joker") G.jokers.push(it.data);
  else if (it.kind === "card")
    G.sideDeck.push(mkCard(it.data.card.s, it.data.card.r, it.data.card.enh));
  else if (it.kind === "consumable") G.consumables.push(it.data);
  else {
    G.vouchers.push(it.data.id);
    if (it.data.id === "teroitin") G.chipBonus += 3;
    if (it.data.id === "tuppisormus") G.tuppiBonus += 1;
    if (it.data.id === "kahvipannu") G.jokerSlots += 1;
    if (it.data.id === "muistikirja") {
      G.consSlots += 1;
      G.shopSlots += 1;
    }
    if (it.data.id === "hihalaukku") G.swaps += 1;
    if (it.data.id === "isompipakka") G.sideSlots += 1;
  }
  showShop();
  render();
}

function sellJoker(i) {
  const j = G.jokers[i];
  const v = Math.max(1, Math.ceil(j.p / 2));
  G.money += v;
  G.jokers.splice(i, 1);
  toast("Myit: " + j.n + " (+$" + v + ")");
  render();
  if (G.phase === "shop") showShop();
}

function sellSideCard(i) {
  const c = G.sideDeck[i];
  if (!c) return;
  const v = Math.max(1, Math.ceil((ENH[c.enh] ? ENH[c.enh].p : 3) / 2));
  G.money += v;
  G.sideDeck.splice(i, 1);
  toast("Myit kortin (+$" + v + ")");
  render();
  if (G.phase === "shop") showShop();
  if (G.phase === "swap") renderSwapPanel();
}

function deal() {
  const d = shuffle(makeDeck());
  G.hands = [[], [], [], []];
  for (let i = 0; i < 52; i++) G.hands[i % 4].push(d[i]);
  for (let p = 1; p < 4; p++) sortHand(G, p);
  G.customOrder = false;
  applySort(G);
  G.trick = [];
  G.trickNo = 0;
  animatedIds.clear();
}

/* Uusi ajo: tila puhtaaksi ja näkymä auki. state.js ei tunne käyttöliittymää,
   joten UI-kutsut asuvat täällä. */

  render();

}

function startBlind() {
  const bi = G.blindIdx;
  G.boss = bi === 2 ? BOSSES[Math.floor(rnd() * BOSSES.length)] : null;
  G.target = Math.round(ANTES[G.ante - 1] * BLIND_MULT[bi]);
  G.blindScore = 0;
  G.dealsLeft = G.deals;

/* Yksi panos = useampi tuppijako, kuten tupissa pisteitä kerätään jako kerrallaan. */

/* Yksi panos = useampi tuppijako, kuten tupissa pisteitä kerätään jako kerrallaan. */
function startDeal() {
  G.usTricks = 0;
  G.themTricks = 0;
  G.scored = 0;
  G.base = 0;
  G.reveal = false;
  G.steal = false;
  G.sooli = false;
  G.sooliOrder = null;
  G.sooliBust = false;
  G.mode = null;
  G.ramSeat = null;
  G.ramTeam = null;
  G.shows = [null, null, null, null];
  deal();
  G.swapsLeft = G.swaps;
  G.swapPick = null;
  G.usedSide = [];
  closeDeclPanel();
  closeOverlay();
  if (G.sideDeck.length && G.swapsLeft > 0) {
    G.phase = "swap";
    render();
    renderSwapPanel();
  } else runDeclarations();

/* --- tuppipakka: vaihda kortteja käteen ennen näyttöä --- */

function doSwap(handCard) {
  const src = G.swapPick;
  if (!src) {
    toast("Valitse ensin kortti tuppipakasta.");
    return;
  }
  if (G.swapsLeft <= 0) {
    toast("Vaihdot käytetty.");
    return;
  }
  const i = G.hands[0].findIndex((c) => c.uid === handCard.uid);
  if (i < 0) return;
  const copy = mkCard(src.s, src.r, src.enh);
  copy.srcUid = src.uid;
  G.hands[0].splice(i, 1, copy);
  G.swapsLeft--;
  G.usedSide.push(src.uid);
  G.swapPick = null;
  applySort(G);
  toast(cardName(handCard) + " → " + cardName(copy));
  render();
  renderSwapPanel();
}

/* ==================== näyttö: rami vai nolo ==================== */
/* Tuppi: etukäsi (jakajan vasen) näyttää ensin, sitten myötäpäivään.
   Punainen kortti = rami, musta = nolo, ei kuvakortteja eikä ässää.
   Ramia pelataan, jos yksikin näyttää sitä. */

function declOrder() {
  const o = [];
  for (let i = 0; i < 4; i++) o.push((G.dealer + 1 + i) % 4);
  return o;
}

function showCardFor(p, decl) {
  const wantRed = decl === "rami";
  const cand = G.hands[p].filter((c) => c.r >= 2 && c.r <= 10 && SM[c.s].red === wantRed);
  return cand.length ? cand[Math.floor(rnd() * cand.length)] : null;
}

function runDeclarations() {
  G.phase = "declare";
  G.declSeq = declOrder();
  G.declIdx = 0;
  render();
  stepDeclare();
}

function stepDeclare() {
  if (G.declIdx >= 4) {
    finishDeclare();
    return;
  }
  const p = G.declSeq[G.declIdx];
  if (p === 0) {
    askDeclaration();
    return;
  }
  const d = aiDeclare(G, p);
  G.shows[p] = { decl: d, card: showCardFor(p, d) };
  G.declIdx++;
  render();
  later(stepDeclare, 620);
}

/* Näyttö tehdään filtin päällä olevassa paneelissa, jotta oma käsi jää näkyviin
   ja järjesteltäväksi päätöksen ajaksi. */

function finishDeclare() {
  const first = G.declSeq.find((p) => G.shows[p] && G.shows[p].decl === "rami");
  if (first === undefined) {
    G.mode = "nolo";
    G.ramSeat = null;
    G.ramTeam = null;
    G.leader = (G.dealer + 1) % 4; /* nolossa etukäsi ajaa */
  } else {
    G.mode = "rami";
    G.ramSeat = first;
    G.ramTeam = isUs(first) ? 0 : 1;
    G.leader = (first + 3) % 4; /* ramaajan oikea puoli ajaa */
  }
  G.turn = G.leader;
  /* Sooli: vain kun vastustajat ramaavat. */
  if (G.mode === "rami" && G.ramTeam === 1) offerSooli();
  else beginPlay();
}

function beginPlay() {
  G.phase = "play";
  closeDeclPanel();
  closeOverlay();
  render();
  if (G.turn !== 0) scheduleAI(760);
}

/* ============================ sooli ============================ */
/* Soolissa ässä on pienin, joten vaaralliset kortit ovat 10..K. */

/* Soolissa ässä on pienin, joten vaaralliset kortit ovat 10..K. */
function sooliRisk() {
  const h = G.hands[0];
  const high = h.filter((c) => c.r >= 10 && c.r <= 13).length;
  const bySuit = {};
  h.forEach((c) => (bySuit[c.s] = bySuit[c.s] || []).push(c));
  let lowGuards = 0;
  for (const k in bySuit) if (bySuit[k].some((c) => c.r === 14 || c.r <= 3)) lowGuards++;
  const verdict =
    high <= 2
      ? "paras mahdollinen — noin joka viides onnistuu"
      : high <= 4
        ? "heikko — onnistuu harvoin"
        : "lähes toivoton";
  return { high, lowGuards, verdict };
}

/* Tuppi: soolaaja antaa parilleen yhden kortin ja saa yhden tilalle sokkona.
   Annettava kortti on soolaajan valinta, ei pelin. */
function beginSooliGive() {
  G.sooli = true; /* ässä on tästä eteenpäin pienin */
  G.phase = "sooligive";
  render();
  declPanel(
    "<h3>Anna Veikolle yksi kortti</h3>" +
      '<div class="ln"><span>Valitse kortti kädestäsi</span><b>saat yhden tilalle sokkona</b></div>' +
      '<p class="fine">Soolissa <b>ässä on pienin</b> kortti, joten korkeat kuvakortit ovat vaarallisimmat — ' +
      "niillä joutuu viemään tikin. Et näe mitä Veikolta tulee tilalle. " +
      "Kätesi on alla, järjestele se vapaasti.</p>",
    () => {},
  );
}

function doSooliGive(give) {
  const i = G.hands[0].findIndex((c) => c.uid === give.uid);
  if (i < 0) return;
  const mate = G.hands[2];
  if (!mate.length) return;
  const get = mate[Math.floor(rnd() * mate.length)];
  G.hands[0].splice(i, 1);
  mate.splice(
    mate.findIndex((c) => c.uid === get.uid),
    1,
  );
  G.hands[0].push(get);
  applySort(G);
  G.hands[2] = []; /* pari ei pelaa */
  const other = G.ramSeat === 1 ? 3 : 1;
  G.sooliOrder = [G.ramSeat, other, 0]; /* soolaaja viimeisenä */
  G.leader = G.ramSeat;
  G.turn = G.ramSeat;
  G.phase = "sooliready";
  render();
  const risk = sooliRisk();
  declPanel(
    "<h3>Vaihto tehty</h3>" +
      '<div class="sidedeck">' +
      cardHTML(give, "mini") +
      '<div style="align-self:center;font-family:var(--font-m);color:#8FA89A">→</div>' +
      cardHTML(get, "mini") +
      "</div>" +
      '<div class="ln"><span>Annoit</span><b>' +
      cardName(give) +
      "</b></div>" +
      '<div class="ln"><span>Sait</span><b>' +
      cardName(get) +
      "</b></div>" +
      '<div class="ln"><span>Käden sooliarvio nyt</span><b>' +
      risk.verdict +
      "</b></div>" +
      '<p class="fine">' +
      SEATS[G.ramSeat].name +
      " aloittaa. Sinä pelaat aina viimeisenä, " +
      "eikä yhtäkään tikkiä saa jäädä sinulle.</p>" +
      '<div class="row"><button class="btn" data-go>Aloita sooli</button></div>',
    (el) =>
      (el.querySelector("[data-go]").onclick = () => {
        closeDeclPanel();
        beginPlay();
      }),
  );
}

/* ============================ pelilogiikka ============================ */

function playCard(p, card) {
  const h = G.hands[p];
  const i = h.findIndex((c) => c.uid === card.uid);
  if (i < 0) return;
  h.splice(i, 1);
  G.trick.push({ p, card });
  if (G.trick.length === trickSize(G)) {
    G.phase = "resolve";
    render();
    later(resolveTrick, 760);
  } else {
    G.turn = nextSeat(G, G.turn);
    render();
    if (G.turn !== 0) scheduleAI(560);
  }
}

function scheduleAI(delay) {
  later(() => {
    if (G.phase !== "play") return;
    playCard(G.turn, chooseAI(G, G.turn));
  }, delay);
}

function resolveTrick() {
  let w = currentWinner(G);
  if (G.steal) {
    const wantMine = G.mode === "rami" && !G.sooli;
    const mine = G.trick.find((t) => t.p === 0);
    const notMine = G.trick.find((t) => t.p !== 0);
    if (wantMine && mine) w = mine;
    else if (!wantMine && notMine) w = notMine;
    G.steal = false;
  }
  const cards = G.trick.map((t) => t.card);
  const leadSeat = G.trick[0].p;
  G.winSeat = w.p;

  if (isUs(w.p)) G.usTricks++;
  else G.themTricks++;
  if (G.sooli && w.p === 0) G.sooliBust = true;

  let pop = null;
  if (scoresForUs(G, w.p) && !G.sooliBust) {
    pop = scoreTrick(G, w.p, leadSeat, cards);
    G.base += pop.total;
    G.scored++;
    showPop(pop);
    /* lasikortti voi särkyä pysyvästi tuppipakasta */
    for (const c of cards) {
      if (c.enh !== "glass" || !c.srcUid) continue;
      if (rnd() >= 0.25) continue;
      const i = G.sideDeck.findIndex((x) => x.uid === c.srcUid);
      if (i >= 0) {
        G.sideDeck.splice(i, 1);
        toast("Lasikortti " + cardName(c) + " särkyi.");
      }
    }
  }
  render();

  later(
    () => {
      G.winSeat = null;
      G.trick = [];
      G.trickNo++;
      if (G.sooliBust) {
        endHand();
        return;
      }
      if (G.trickNo >= 13) {
        endHand();
        return;
      }
      G.leader = w.p;
      G.turn = w.p;
      if (G.sooli) {
        /* soolaaja pelaa aina viimeisenä */
        const other = G.sooliOrder.filter((x) => x !== 0 && x !== w.p)[0];
        G.sooliOrder = [w.p, other, 0];
        G.turn = w.p;
      }
      G.phase = "play";
      render();
      if (G.turn !== 0) scheduleAI(600);
    },
    pop ? 1250 : 650,
  );
}

function endHand() {
  G.phase = "handend";
  const sc = finalScore(G);
  G.blindScore += sc;
  G.dealsLeft--;
  render();
  later(() => {
    if (G.blindScore >= G.target) showCashOut(sc);
    else if (G.dealsLeft <= 0) showGameOver();
    else showDealEnd(sc);
  }, 500);
}

function nextBlind() {
  G.beaten[G.blindIdx] = true;
  if (G.blindIdx === 2) {
    if (G.ante >= 8) {
      showVictory();
      return;
    }
    G.ante++;
    G.blindIdx = 0;
    G.beaten = [false, false, false];
  } else G.blindIdx++;
  G.dealer = (G.dealer + 1) % 4;
  G.phase = "blindselect";
  showBlindSelect();
  render();
}

/* ============================ temput ============================ */
function useConsumable(i) {
  const c = G.consumables[i];
  if (!c) return;
  if (G.phase !== "play") {
    toast("Odota että jako on käynnissä.");
    return;
  }
  if ((c.id === "uusijako" || c.id === "kannanvaihto") && G.trickNo > 0) {
    toast(c.n + " onnistuu vain ennen ensimmäistä tikkiä.");
    return;
  }
  if (c.id === "kannanvaihto" && G.sooli) {
    toast("Soolin aikana ei vaihdeta kantaa.");
    return;
  }
  G.consumables.splice(i, 1);

  if (c.id === "kurkistus") {
    G.reveal = true;
    toast("Kurkistit: kaikki kädet näkyvissä.");
  }
  if (c.id === "tikkivarkaus") {
    G.steal = true;
    toast("Seuraava tikki ohjataan sinulle sopivasti.");
  }
  if (c.id === "kannanvaihto") {
    if (G.mode === "rami") {
      G.mode = "nolo";
      G.ramSeat = null;
      G.ramTeam = null;
      toast("Jaosta tuli nolo.");
    } else {
      G.mode = "rami";
      G.ramSeat = 0;
      G.ramTeam = 0;
      toast("Jaosta tuli rami — sinä ramaat.");
    }
  }
  if (c.id === "vaihtokauppa") {
    const mine = G.hands[0],
      mate = G.hands[2];
    if (mine.length && mate.length) {
      const worst =
        G.mode === "nolo"
          ? mine.slice().sort((a, b) => b.r - a.r)[0] /* nolossa korkein on huonoin */
          : mine.slice().sort((a, b) => a.r - b.r)[0];
      const best =
        G.mode === "nolo"
          ? mate.slice().sort((a, b) => a.r - b.r)[0]
          : mate.slice().sort((a, b) => b.r - a.r)[0];
      mine.splice(
        mine.findIndex((c2) => c2.uid === worst.uid),
        1,
      );
      mate.splice(
        mate.findIndex((c2) => c2.uid === best.uid),
        1,
      );
      mine.push(best);
      mate.push(worst);
      applySort(G);
      sortHand(G, 2);
      toast("Vaihdoit " + cardName(worst) + " → " + cardName(best));
    }
  }
  if (c.id === "uusijako") {
    const d = G.dealer;
    deal();
    G.dealer = d;
    G.turn = G.leader;
    toast("Kortit jaettiin uudelleen.");
    render();
    if (G.turn !== 0) scheduleAI(700);
    return;
  }
  render();
}

function initHandDrag(row) {
  row.querySelectorAll("[data-id]").forEach((el) => {
    el.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      dragId = el.dataset.id;
      dragMoved = false;
      dragStartX = e.clientX;
      try {
        el.setPointerCapture(e.pointerId);
      } catch {}
    });
    el.addEventListener("pointermove", (e) => {
      if (dragId !== el.dataset.id) return;
      if (!dragMoved && Math.abs(e.clientX - dragStartX) < 8) return;
      dragMoved = true;
      el.classList.add("dragging");
      let placed = false;
      for (const sib of Array.from(row.children)) {
        if (sib === el) continue;
        const r = sib.getBoundingClientRect();
        if (e.clientX < r.left + r.width / 2) {
          row.insertBefore(el, sib);
          placed = true;
          break;
        }
      }
      if (!placed) row.appendChild(el);
    });
    const finish = () => {
      if (dragId !== el.dataset.id) return;
      if (dragMoved) {
        const order = Array.from(row.children).map((x) => x.dataset.id);
        G.hands[0].sort((a, b) => order.indexOf(a.uid) - order.indexOf(b.uid));
        G.customOrder = true;
        justDragged = true;
        later(() => {
          justDragged = false;
        }, 350);
        renderHand();
      }
      dragId = null;
      dragMoved = false;
    };
    el.addEventListener("pointerup", finish);
    el.addEventListener("pointercancel", finish);
  });
}

function renderHand() {
  const row = document.getElementById("handrow");
  const hand = G.hands[0] || [];
  const legal =
    G.phase === "play" && G.turn === 0 ? new Set(legalCards(G, 0).map((c) => c.uid)) : null;
  const shown = G.shows[0] && G.shows[0].card ? G.shows[0].card.uid : null;
  /* Näyttökierroksella kortit levitetään, jotta koko käsi näkyy kerralla. */
  row.className =
    "handrow" +
    (G.phase === "declare" || G.phase === "swap" || G.phase === "sooligive" ? " spread" : "");
  row.innerHTML = hand
    .map((c) => {
      const ok = legal && legal.has(c.uid);
      const cls = [
        "hcard",
        ok ? "playable" : "",
        legal && !ok ? "dead" : "",
        c.uid === shown ? "shown" : "",
      ].join(" ");
      return cardHTML(c, cls).replace(
        "<div class=",
        '<div tabindex="0" data-id="' + c.uid + '" class=',
      );
    })
    .join("");
  row.querySelectorAll("[data-id]").forEach((el) => {
    const c = hand.find((x) => x.uid === el.dataset.id);
    const act = () => {
      if (justDragged) return;
      if (G.phase === "swap") {
        doSwap(c);
        return;
      }
      if (G.phase === "sooligive") {
        doSooliGive(c);
        return;
      }
      if (G.phase !== "play" || G.turn !== 0) return;
      if (!legalCards(G, 0).some((x) => x.uid === c.uid)) {
        toast("Maantuntopakko: sinun on tunnustettava " + SM[leadSuit(G)].n.toLowerCase() + "a.");
        return;
      }
      playCard(0, c);
    };
    el.onclick = act;
    el.onkeydown = (e) => {
      if (e.altKey && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
        e.preventDefault();
        const h = G.hands[0];
        const i = h.findIndex((x) => x.uid === c.uid);
        const j = e.key === "ArrowLeft" ? i - 1 : i + 1;
        if (j < 0 || j >= h.length) return;
        const t = h[i];
        h[i] = h[j];
        h[j] = t;
        G.customOrder = true;
        renderHand();
        const nel = row.querySelector('[data-id="' + c.uid + '"]');
        if (nel) nel.focus();
        return;
      }
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        act();
      }
    };
  });
  initHandDrag(row);
  renderHandTools();

  const h = document.getElementById("hint");
  if (G.phase === "play" && G.turn === 0)
    h.textContent = leadSuit(G)
      ? "Tunnusta maata: " +
        SM[leadSuit(G)].n +
        (G.mode === "nolo" ? " · väistä tikki" : " · vie tikki")
      : G.mode === "nolo"
        ? "Sinä ajat — aja matalalla"
        : "Sinä ajat";
  else if (G.phase === "play") h.textContent = SEATS[G.turn].name + " miettii…";
  else if (G.phase === "swap")
    h.textContent = G.swapPick
      ? "Valitse kädestä kortti jonka vaihdat"
      : "Tuppipakka — valitse vaihdettava kortti";
  else if (G.phase === "sooligive") h.textContent = "Sooli — valitse kortti jonka annat Veikolle";
  else if (G.phase === "sooliready") h.textContent = "Sooli alkaa";
  else if (G.phase === "declare") h.textContent = "Näyttökierros — järjestele käsi vapaasti";
  else h.textContent = "";
}

      if (curEl) curEl.onclick = () => curEl.select();
      const newEl = el.querySelector("#seednew");
      if (newEl) later(() => newEl.focus(), 0);
      el.querySelector("[data-start]").onclick = () => startRun(newEl ? newEl.value : "");
      el.querySelector("[data-same]").onclick = () => startRun(cur);
      el.querySelector("[data-x]").onclick = () => {
        closeOverlay();
        if (G.phase === "blindselect") showBlindSelect();
        else if (G.phase === "shop") showShop();
        else render();
      };
    },
  );
}

function showGameOver() {
  saveBest(G.ante);
  const info = tuppiInfo(G);
  let why;
  if (G.sooliBust) why = "Sooli kaatui heti ensimmäiseen tikkiin — ramaajat korjasivat potin.";
  else if (G.mode === "rami" && G.usTricks < 7)
    why =
      "Rami jäi vajaaksi (" +
      G.usTricks +
      "/7). Tupissa se tarkoittaa ryöstöä: vastapuoli laskee pisteet kaksinkertaisina.";
  else if (G.mode === "nolo" && G.usTricks > 6)
    why = "Nolo kaatui: veitte " + G.usTricks + " tikkiä, eli enemmän kuin vastustajat.";
  else why = "Kerroin ×" + info.mult + " ei riittänyt — pohja jäi liian ohueksi.";
  why += " Panoksen kaikki " + G.deals + " jakoa on pelattu.";

  overlay(
    "<h2>Jouduitte tuppeen</h2>" +
      '<p class="dek">Panoksen pisteet ' +
      G.blindScore.toLocaleString("fi-FI") +
      ", tavoite oli " +
      G.target.toLocaleString("fi-FI") +
      ". " +
      why +
      "</p>" +
      '<div class="cashline"><span>Panos</span><b>' +
      G.ante +
      "/8</b></div>" +
      '<div class="cashline"><span>Tikit</span><b>' +
      G.usTricks +
      "–" +
      G.themTricks +
      "</b></div>" +
      '<div class="cashline"><span>Paras panos</span><b>' +
      Math.max(bestAnte(), G.ante) +
      "</b></div>" +
      '<div class="cashline"><span>Siemen</span><b>' +
      G.seed +
      "</b></div>" +
      '<div class="row" style="margin-top:18px"><button class="btn" data-new>Uusi peli</button>' +
      '<button class="btn ghost" data-retry>Toista tämä siemen</button>' +
      '<button class="btn ghost" data-rules>Ohjeet</button></div>',
    (el) => {
      const seed = G.seed;
      el.querySelector("[data-new]").onclick = () => startRun();
      el.querySelector("[data-retry]").onclick = () => startRun(seed);
      el.querySelector("[data-rules]").onclick = showRules;
    },
  );
}

function showVictory() {
  saveBest(9);
  overlay(
    "<h2>Vastapuoli tuppeen</h2>" +
      '<p class="dek">Kahdeksan panosta kaadettu. Oikeassa tupissa peli päättyy, kun toinen pari kerää 52 pistettä — ' +
      "nyt se on tehty kahdeksassa jaossa ja jokeripinolla, jota Oulunsalon tuppikerhossa ei ihan hyväksyttäisi.</p>" +
      '<div class="cashline"><span>Kassa</span><b>$' +
      G.money +
      "</b></div>" +
      '<div class="cashline"><span>Jokerit</span><b>' +
      (G.jokers.map((j) => j.n).join(", ") || "–") +
      "</b></div>" +
      '<div class="cashline"><span>Siemen</span><b>' +
      G.seed +
      "</b></div>" +
      '<div class="row" style="margin-top:18px"><button class="btn gold" data-new>Uusi peli</button></div>',
    (el) => (el.querySelector("[data-new]").onclick = () => startRun()),
  );
}

function showRules() {
  const rows = Object.values(TYPES)
    .map(
      (t) =>
        "<tr><td>" +
        t.n +
        '</td><td class="n">' +
        t.chips +
        '</td><td class="n">×' +
        t.mult +
        "</td></tr>",
    )
    .join("");
  overlay(
    "<h2>Ohjeet</h2>" +
      '<p class="dek">Tupin säännöt, Balatron rakenne. Istut etelässä, Veikko on parisi pohjoisessa, ' +
      "Raimo ja Sirpa vastustavat.</p>" +
      '<div class="rules"><div class="cols"><div>' +
      "<h3>Tuppi — oikeat säännöt</h3><ul>" +
      "<li>Neljä pelaajaa, kaksi paria vastakkain, koko pakka, 13 korttia kullekin.</li>" +
      "<li><b>Valttia ei ole.</b> Maantuntopakko: ajettua maata on tunnustettava, muuten saa pelata mitä vain.</li>" +
      "<li>Tikin voittaa suurin ajetun maan kortti. Ässä on korkein.</li>" +
      "<li><b>Näyttö:</b> etukäsi (jakajan vasen) näyttää ensin, sitten myötäpäivään. Punainen kortti = rami, musta = nolo. Kuvakorttia tai ässää ei saa näyttää. Ramia pelataan, jos yksikin näyttää sitä.</li>" +
      "<li><b>Rami:</b> tavoite 7 tikkiä = 4 pistettä, ja joka lisätikki 4 lisää.</li>" +
      "<li><b>Nolo:</b> vähemmän tikkejä vienyt pari voittaa. 6 tikkiä = 4 pistettä, joka tikki vähemmän 4 lisää.</li>" +
      "<li><b>Ryöstö:</b> jos ramannut pari jää alle seitsemän, vastapuoli laskee pisteensä kaksinkertaisina.</li>" +
      "<li><b>Sooli:</b> puolustava pelaaja voi pelata yksin. Yksi kortti vaihdetaan parin kanssa, ässä on pienin ja soolaaja pelaa viimeisenä. Tikitön sooli = 24 pistettä, yksikin tikki = 24 ramaajille.</li>" +
      "<li>Peli päättyy 52 pisteeseen: hävinnyt pari on saatu <i>tuppeen</i>.</li>" +
      "</ul></div><div>" +
      "<h3>Mitä Balatro tuo</h3><ul>" +
      "<li>Kahdeksan panosta, kussakin pieni, iso ja pomo. Pomon tavoite on kaksinkertainen ja sillä on sääntömuutos.</li>" +
      "<li>Yksi panos = neljä tuppijakoa, joiden pisteet lasketaan yhteen (kuten Balatron neljä kättä). Jokainen pisteyttävä tikki lasketaan pokerikätenä: <b>Chips × Mult</b>.</li>" +
      "<li>Ramissa pisteytät <b>viemäsi</b> tikit, nolossa ja soolissa <b>väistämäsi</b>.</li>" +
      "<li>Tupin pistelasku on suoraan tuppi-kerroin: rami 7 tikkiä = ×1, 9 tikkiä = ×3; nolo 6 tikkiä = ×1, 3 tikkiä = ×4; ryöstö kaksinkertaistaa; sooli ×6.</li>" +
      "<li>Vajaa rami tai kaatunut nolo = kerroin 0: jako menee hukkaan, aivan kuten tupissa. Jakoja on neljä, joten yksi moka ei vielä kaada panosta.</li>" +
      "<li>Panoksen jälkeen kauppa: jokereita, jalostettuja kortteja, temppuja ja pomon jälkeen pysyviä kuponkeja.</li>" +
      "<li><b>Tuppipakka:</b> kaupasta ostetut kortit säilyvät ajon loppuun. Joka jaon alussa saat vaihtaa niistä " +
      "<b>2 korttia</b> käteesi — ennen näyttöä, joten vaihto vaikuttaa myös siihen ramaatko. Vaihdettu kortti poistuu siitä jaosta.</li>" +
      "<li>Laskujärjestys: korttien lisäykset, jokerien lisäykset, korttien kertoimet, jokerien kertoimet.</li>" +
      "</ul></div></div>" +
      "<h3>Korttijalosteet</h3>" +
      "<p>Kaksi parasta jalostetta eivät lisää numeroita vaan taivuttavat tupin sääntöjä.</p>" +
      '<table class="tbl"><thead><tr><th>Jaloste</th><th>Vaikutus</th></tr></thead><tbody>' +
      Object.keys(ENH)
        .map((k) => "<tr><td>" + ENH[k].g + " " + ENH[k].n + "</td><td>" + ENH[k].t + "</td></tr>")
        .join("") +
      "</tbody></table>" +
      "<h3>Tikkityypit</h3>" +
      "<p>Tikissä on neljä korttia (soolissa kolme). Koska maata on tunnustettava, <b>väri</b> on tavallisin tikki.</p>" +
      '<table class="tbl"><thead><tr><th>Tikki</th><th class="n">Chips</th><th class="n">Mult</th></tr></thead><tbody>' +
      rows +
      "</tbody></table>" +
      '<p style="margin-top:10px">Korttien omat chipsit lasketaan päälle: 2–10 arvonsa verran, kuvat 10, ässä 11.</p>' +
      '<p style="margin-top:10px;font-size:12.5px;color:#8FA89A">Tupin säännöt tarkistettu Oulun Seniorien tuppikerhon sääntöpaperista (Antti Auer, 9.9.2022) ja korttipeliopas.fi:stä.</p>' +
      '</div><div class="row" style="margin-top:18px"><button class="btn" data-x>Takaisin</button></div>',
    (el) =>
      (el.querySelector("[data-x]").onclick = () => {
        closeOverlay();
        if (G.phase === "blindselect") showBlindSelect();
        else if (G.phase === "shop") showShop();
        else render();
      }),
  );
}
