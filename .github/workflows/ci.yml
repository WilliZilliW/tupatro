name: ci

on:
  push:
  pull_request:

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prettier --check "**/*.{ts,tsx,json,md,html}"
      - run: npm test
      - run: npm run build
      - name: Upload the built game
        uses: actions/upload-artifact@v4
        with:
          name: tupatro
          path: dist
          if-no-files-found: error
