name: tests

on:
  push:
  pull_request:

jobs:
  check:
    name: Lint, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check "src/**/*.js" "test/**/*.js" build.js
      # npm test builds first, then runs the rule tests against src/ and the
      # invariant tests against the build output in dist/.
      - run: npm test
      - name: Upload the built game
        uses: actions/upload-artifact@v4
        with:
          name: tupatro
          path: dist/tupatro.html
          if-no-files-found: error
