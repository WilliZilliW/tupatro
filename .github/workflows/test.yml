name: tests

on:
  push:
  pull_request:

jobs:
  rules:
    name: Rule tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No dependencies, so no npm ci step.
      - name: Run rule tests
        run: node test.js
